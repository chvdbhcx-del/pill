name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      # The unit tests that need a Direct2D device (the snapshot_* renders) are skipped: a hosted runner has no GPU.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --workspace -- --skip snapshot

      # Informational until the tree is clean; flip continue-on-error to false to make them gates.
      - name: cargo fmt --check
        continue-on-error: true
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --locked --workspace -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit (known vulnerabilities in Cargo.lock)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
