.drawer>div{overflow:hidden;min-height:0}
textarea{width:100%;min-height:110px;margin-top:12px;padding:14px 16px;border-radius:20px;border:1.5px solid var(--line);background:#FFFFFF08;color:var(--text);font:500 16px/1.4 inherit;font-family:inherit;resize:none;outline:none;transition:border-color .25s,box-shadow .25s}

.list{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}

.nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

$('clear').addEventListener('click',function(){items(function(it){if(it.state==='done'||it.state==='error')removeItem(it)})});
$('a2hsx').addEventListener('click',function(){sset('pill.w.hint','1');$('a2hs').classList.remove('show')});
$('host2go').addEventListener('click',function(){var h=$('host2').value;if(!goHost(h)){$('host2').focus()}});
var fgT=0;
$('forget').addEventListener('click',function(){
 var b=this;
 if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent=tr('forgetSure');clearTimeout(fgT);fgT=setTimeout(function(){b.removeAttribute('data-sure');b.textContent=tr('forget')},4000);return}
 b.removeAttribute('data-sure');b.textContent=tr('forget');
 var h=authH();stopConn();
 var done=function(){forgetLocal();S.stay=false;showPair()};
 fetch('/api/device',{method:'DELETE',headers:h}).then(done,done);
});

// ---- start
var q=new URLSearchParams(location.search),qc=q.get('c');
if(qc&&history.replaceState){try{history.replaceState(null,'',location.pathname)}catch(e){}}
if(qc){
 // a QR scan: the code is one-use, so it is spent only where the user wants the pairing to live (see the install card)
 var qh=q.get('h'),qp=q.get('p');if(qh&&qp&&hostOk(qh+':'+qp))sset('pill.w.host',qh+':'+qp);
 S.stay=!(IOS&&!STANDALONE);
 showPair();
 $('code').value=qc.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
 if(S.stay&&$('code').value.length===8)pairNow();
}else if(S.token){enterMain()}
else showPair();
})();
</script>
