<link rel="preload" href="fonts/MedeoSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="preload" href="fonts/MedeoSans-Medium.ttf" as="font" type="font/ttf" crossorigin />

<body>
<div id="win">
  <header id="titlebar" data-tauri-drag-region>
    <div class="tb-drag" data-tauri-drag-region></div>
    <button class="cap-btn" id="b-min" type="button" aria-label="Minimize"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 5.5h10" /></svg></button>
    <button class="cap-btn" id="b-max" type="button" aria-label="Maximize">
      <svg class="g-max" viewBox="0 0 10 10" width="10" height="10"><rect x=".5" y=".5" width="9" height="9" rx="1.2" /></svg>
      <svg class="g-rest" viewBox="0 0 10 10" width="10" height="10"><rect x=".5" y="2.5" width="7" height="7" rx="1.2" /><path d="M2.5 2.5V1.7A1.2 1.2 0 0 1 3.7.5h4.6a1.2 1.2 0 0 1 1.2 1.2v4.6a1.2 1.2 0 0 1-1.2 1.2h-.8" /></svg>
    </button>
    <button class="cap-btn close" id="b-close" type="button" aria-label="Close"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M.5.5l9 9M9.5.5l-9 9" /></svg></button>
  </header>
  <div id="body">
    <nav id="side" aria-label="Settings"></nav>
    <main id="content"><div id="page"></div></main>
  </div>
</div>
