name = "pill-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# One Room object per pairing (idFromName(room)); one Limiter object per source IP.
[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "LIMITER", class_name = "Limiter" },
]

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limiter"]
